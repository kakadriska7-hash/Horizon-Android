name: Build Waypoints HMOD
on:
  push:
    paths:
      - 'mods/waypoints/**'
      - '.github/workflows/build-waypoints.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install cargo-horizon-mod
        run: cargo install --path crates/cargo-horizon-mod
      - name: Build HMOD
        working-directory: mods/waypoints
        run: |
          rm -f Cargo.toml
          cargo horizon-mod --help
          cargo horizon-mod build
      - uses: actions/upload-artifact@v4
        with:
          name: waypoints-hmod
          path: "**/*.hmod"
