name: Build Waypoints HMOD
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build HMOD
        run: cargo run -p cargo-horizon-mod -- build --manifest-path mods/waypoints/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: waypoints-hmod
          path: "**/*.hmod"
