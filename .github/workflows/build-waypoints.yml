name: Build Waypoints HMOD
on:
  push:
    paths:
      - 'mods/waypoints/**'
      - '.github/workflows/build-waypoints.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-tools
        run: cargo install wasm-tools
      - name: Build WASM & HMOD
        working-directory: mods/waypoints
        run: |
          cargo build --target wasm32-unknown-unknown --release
          wasm-tools component new target/wasm32-unknown-unknown/release/waypoints.wasm -o waypoints.hmod
          ls -lh waypoints.hmod
      - uses: actions/upload-artifact@v4
        with:
          name: waypoints-hmod
          path: mods/waypoints/waypoints.hmod
